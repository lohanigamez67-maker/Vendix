<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendix - Ingresar</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
body{background:#f5f6fa;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login-card{width:100%;max-width:380px;border:0;border-radius:15px}
</style>
</head>
<body>
<div class="card shadow-sm login-card">
  <div class="card-body p-4">
    <h4 class="fw-bold text-center mb-1"><i class="fa-solid fa-store"></i> Vendix</h4>
    <p class="text-muted text-center mb-4">Ingresa para continuar</p>

    {% with mensajes = get_flashed_messages(with_categories=true) %}
    {% for categoria, mensaje in mensajes %}
    <div class="alert alert-{{ categoria }}">{{ mensaje }}</div>
    {% endfor %}
    {% endwith %}

    <form action="/login" method="POST">
      <label class="form-label">Usuario</label>
      <input name="usuario" class="form-control mb-3" autocomplete="username" autocapitalize="none" required>
      <label class="form-label">Clave</label>
      <input type="password" name="clave" class="form-control mb-4" autocomplete="current-password" required>
      <button class="btn btn-dark w-100"><i class="fa-solid fa-right-to-bracket"></i> Entrar</button>
    </form>
  </div>
</div>
</body>
</html>
